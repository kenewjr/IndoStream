name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main code
        uses: actions/checkout@v6
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v6
        with:
          ref: "builds"
          path: "builds"

      - name: Checkout builds (create if not exists)
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          if git ls-remote --exit-code $REPO builds; then
            echo "Branch 'builds' exists, checking out..."
            git clone --branch builds $REPO builds
          else
            echo "Branch 'builds' does not exist, creating..."
            git clone $REPO builds
            cd builds
            git checkout --orphan builds
            git rm -rf .
            echo "# builds branch" > README.md
            git add README.md
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git commit -m "init builds branch"
            git push $REPO builds
          fi

      - name: Clean old builds
        run: |
          rm -f builds/*.cs3 || true
          rm -f builds/*.jar || true
          rm -f builds/plugins.json || true

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          cache-read-only: false

      - name: Access Secrets (local.properties)
        run: |
          cd src
          echo DUBBINDO_API=${{ secrets.DUBBINDO_API }} >> local.properties
          echo OPLOVERZ_API=${{ secrets.OPLOVERZ_API }} >> local.properties
          echo OTAKUDESU_API=${{ secrets.OTAKUDESU_API }} >> local.properties
          echo PENCURIMOVIE_API=${{ secrets.PENCURIMOVIE_API }} >> local.properties
          echo SAMEHADAKU_API=${{ secrets.SAMEHADAKU_API }} >> local.properties

      - name: Build Plugins
        run: |
          cd src
          chmod +x gradlew
          ./gradlew make makePluginsJson ensureJarCompatibility -x lint --continue
          cp **/build/*.cs3 ../builds || true
          cp **/build/*.jar ../builds || true
          cp build/plugins.json ../builds || true

      - name: Generate CloudStream repo.json
        run: |
          # CloudStream "Add repository" mengharapkan file manifest bernama
          # repo.json yang berisi field pluginLists, bukan langsung plugins.json.
          # File ini yang di-paste ke app, lalu CloudStream sendiri yang
          # men-download plugins.json yang ditunjuk di pluginLists.
          REPO_RAW="https://raw.githubusercontent.com/${{ github.repository }}/builds"
          cat > builds/repo.json <<EOF
          {
            "name": "IndoStream",
            "description": "CloudStream extensions untuk situs streaming Indonesia.",
            "manifestVersion": 1,
            "homepage": "https://github.com/${{ github.repository }}",
            "pluginLists": [
              "${REPO_RAW}/plugins.json"
            ]
          }
          EOF
          echo "Generated builds/repo.json:"
          cat builds/repo.json

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp **/build/*.jar $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0   # do not error if nothing to commit
          git push --force
